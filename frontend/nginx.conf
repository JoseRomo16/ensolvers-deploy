server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets are immutable; the HTML must never be cached or users keep
    # loading an old bundle after a deploy.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # `trailingSlash: true` emits /route/index.html, so deep links resolve as
    # directories; anything unknown falls back to the SPA entry point.
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }
}
